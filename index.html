// ===== 第97项新增补丁：单据硬边界（网名+时间 > 空行 > 分隔线）=====
// 设计原则：
// 1. 只追加，不修改任何原有函数；
// 2. 每张单据只做“整段交给原有 calculateSingleBatch()”一件事，段内不再二次切分；
// 3. 网名+时间优先（与旧 splitMessageBatches 边界规则完全一致），其次空行，最后交还原预览逻辑。
(function () {
    if (typeof multiBuildAndParse !== 'function') return;
    if (typeof calculateSingleBatch !== 'function') return;

    var V2_SEP_RE = /^\s*(?:-{3,}|={3,}|_{3,}|\*{3,}|—{3,}|～{3,})\s*$/;
    var V2_PLAY_RE = /三中三|3中3|二中二|2中2|三中二|3中2|四全中|平特|特码|特碼|正码|尾数|半波|波色|复式|复试|连肖|连码|生肖|包绿|包蓝|包红|单数|双数|头|尾/;
    var V2_AMOUNT_RE = /\d+(?:\.\d+)?\s*(?:元|米|块|快|文|蚊|斤|闷|元整)|(?:各|每|共|合计|共计|组)\s*(?:[零一二三四五六七八九十百千万两]+|\d+(?:\.\d+)?)/;

    function v2HasDigit(text) { return /\d/.test(String(text || '')); }
    function v2HasPlay(text) { return V2_PLAY_RE.test(String(text || '')); }
    function v2HasAmount(text) { return V2_AMOUNT_RE.test(String(text || '')); }

    // ---------- 边界一：网名 + 时间（最高优先级）----------
    function v2BuildTimeBlocks(text) {
        var lines = String(text || '').split(/\r?\n/);
        var hasTime = false;
        for (var i = 0; i < lines.length; i++) {
            if (isTimeLine(lines[i])) { hasTime = true; break; }
        }
        if (!hasTime) return null;

        var blocks = [];
        var current = [];
        var preamble = [];
        var started = false;
        var currentMeta = null;

        function push(arr, meta, isPreamble) {
            var value = arr.join('\n').trim();
            if (value) blocks.push({ text: value, meta: meta || null, isPreamble: !!isPreamble });
        }

        for (var j = 0; j < lines.length; j++) {
            var line = String(lines[j] || '').trim();
            if (isTimeLine(line)) {
                if (!started) {
                    var firstName = '';
                    if (preamble.length && preamble[preamble.length - 1]) firstName = preamble.pop();
                    push(preamble, null, true);
                    preamble = [];
                    started = true;
                    current = [];
                    currentMeta = {
                        name: firstName,
                        time: line,
                        label: (firstName ? firstName + ' · ' : '') + line
                    };
                } else {
                    var nextName = '';
                    if (current.length && current[current.length - 1]) nextName = current.pop();
                    push(current, currentMeta);
                    current = [];
                    currentMeta = {
                        name: nextName,
                        time: line,
                        label: (nextName ? nextName + ' · ' : '') + line
                    };
                }
                continue;
            }
            if (!started) {
                if (line) preamble.push(line);
            } else if (line) {
                current.push(line);
            }
        }
        if (started) push(current, currentMeta);
        else push(preamble, null, true);
        return blocks.length ? blocks : null;
    }

    // ---------- 边界二：空行 / 分隔线 ----------
    function v2BuildBlankBlocks(text) {
        var raw = String(text || '');
        var hasBlank = /\n[ \t]*\n/.test(raw);
        var hasSep = /(^|\n)\s*(?:-{3,}|={3,}|_{3,}|\*{3,}|—{3,}|～{3,})\s*(\n|$)/.test(raw);
        if (!hasBlank && !hasSep) return null;

        var normalized = raw.split(/\r?\n/).map(function (line) {
            return V2_SEP_RE.test(line) ? '' : line;
        }).join('\n');

        var pieces = normalized.split(/\n[ \t]*\n/);
        var blocks = [];
        pieces.forEach(function (piece) {
            var value = String(piece || '').trim();
            if (value) blocks.push({ text: value, meta: null });
        });
        return blocks.length ? blocks : null;
    }

    // ---------- 用原有单条入口解析一张单据（完全隔离，不污染历史）----------
    function v2RunOldPath(text) {
        var inputEl = document.getElementById('commandInput');
        var errorTip = document.getElementById('errorTip');
        if (!inputEl) return { records: [], messages: [] };

        var savedValue = inputEl.value;
        var savedHistory = historyData;
        var savedTipHtml = errorTip ? errorTip.innerHTML : '';
        var savedTipDisplay = errorTip ? errorTip.style.display : '';
        var records = [];
        var messages = [];

        try {
            historyData = [];
            inputEl.value = text;
            calculateSingleBatch();
            records = historyData.slice();
            if (errorTip && errorTip.innerHTML && String(errorTip.innerHTML).trim()) {
                messages = String(errorTip.innerHTML)
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<[^>]+>/g, '')
                    .split('\n')
                    .map(function (s) { return s.replace(/^[•\s]+/, '').trim(); })
                    .filter(Boolean);
            }
        } catch (err) {
            messages = ['解析异常：' + (err && err.message ? err.message : String(err))];
        } finally {
            historyData = savedHistory;
            inputEl.value = savedValue;
            if (errorTip) {
                errorTip.innerHTML = savedTipHtml;
                errorTip.style.display = savedTipDisplay;
            }
            if (typeof renderHistory === 'function') renderHistory();
        }
        return { records: records, messages: messages };
    }

    // ---------- 单据 -> 卡片数据 ----------
    function v2ParseBlock(block) {
        var text = String(block && block.text || '').trim();
        var meta = block && block.meta ? block.meta : null;
        var orderNo = block && block.orderNo;
        var items = [];
        var errors = [];
        var warnings = [];
        var notes = '';

        if (!text) {
            return {
                text: '', meta: meta, orderNo: orderNo, items: [], totalCount: 0, subtotal: 0,
                status: 'skip', errors: [], warnings: [], note: '空单据'
            };
        }

        var result = v2RunOldPath(text);

        result.records.forEach(function (rec) {
            var count = Number(rec.count);
            var unit = Number(rec.unit);
            var subtotal = Number(rec.subtotal == null ? count * unit : rec.subtotal);
            if (!(count > 0) || !(unit > 0) || !(subtotal > 0)) {
                errors.push('有一个投注条目结构不完整');
                return;
            }
            items.push({
                type: String(rec.type || ''),
                detail: String(rec.detail == null ? '' : rec.detail),
                count: count,
                unit: unit,
                subtotal: subtotal
            });
        });

        result.messages.forEach(function (msg) {
            if (items.length) warnings.push(msg);
            else errors.push(msg);
        });

        var totalCount = items.reduce(function (sum, item) { return sum + item.count; }, 0);
        var subtotal = items.reduce(function (sum, item) { return sum + item.subtotal; }, 0);

        var status;
        if (items.length) {
            status = warnings.length ? 'warn' : 'ok';
        } else if (block && block.isPreamble) {
            status = 'skip';
            notes = '时间标记之前的文字，已忽略';
        } else if (!v2HasDigit(text) && !v2HasPlay(text)) {
            status = 'skip';
            notes = '未包含号码或玩法，视为标题/非单据';
        } else if (!v2HasAmount(text)) {
            status = 'error';
            if (!errors.length) errors.push('缺少明确的金额，未进行计算');
        } else {
            status = 'error';
            if (!errors.length) errors.push('没有识别出有效投注');
        }

        var uniqueErrors = [];
        errors.forEach(function (e) { if (uniqueErrors.indexOf(e) < 0) uniqueErrors.push(e); });
        var uniqueWarnings = [];
        warnings.forEach(function (w) { if (uniqueWarnings.indexOf(w) < 0) uniqueWarnings.push(w); });

        return {
            text: text, meta: meta, orderNo: orderNo,
            items: items, totalCount: totalCount, subtotal: subtotal,
            status: status, errors: status === 'error' ? uniqueErrors : [],
            warnings: uniqueWarnings, note: notes
        };
    }

    // ---------- 包装原有入口（旧实现完整保留为回退）----------
    var multiBuildAndParseBeforeV2 = multiBuildAndParse;
    multiBuildAndParse = function (text) {
        var timeBlocks = v2BuildTimeBlocks(text);
        var blocks = timeBlocks || v2BuildBlankBlocks(text);
        if (!blocks) {
            var fallback = multiBuildAndParseBeforeV2(text);
            fallback.mode = 'legacy';
            return fallback;
        }
        var parsed = blocks.map(function (block) { return v2ParseBlock(block); });
        return { blocks: blocks, parsed: parsed, mode: timeBlocks ? 'time' : 'blank' };
    };

    var multiParseBlockBeforeV2 = (typeof multiParseBlock === 'function') ? multiParseBlock : null;
    multiParseBlock = function (block) {
        var parsed = v2ParseBlock(block);
        if (parsed.items.length || !multiParseBlockBeforeV2) return parsed;
        return multiParseBlockBeforeV2(block);
    };

    // ---------- 合并两张单据：优先保持总金额不变 ----------
    var multiActionMergeBeforeV2 = (typeof multiActionMerge === 'function') ? multiActionMerge : null;
    if (multiActionMergeBeforeV2) {
        multiActionMerge = function (index) {
            if (index <= 0 || index >= multiPreviewState.parsed.length) return;
            var prev = multiPreviewState.parsed[index - 1];
            var cur = multiPreviewState.parsed[index];
            var expected = Number(prev.subtotal || 0) + Number(cur.subtotal || 0);
            var mergedText = String(prev.text || '').trim() + '\n' + String(cur.text || '').trim();
            var merged = multiParseBlock({ text: mergedText, meta: prev.meta || cur.meta, orderNo: prev.orderNo });

            // 两张都能算：合并后总额必须不变。若重新解析把金额算高了，则直接拼接条目，绝不虚增。
            if (prev.status !== 'error' && cur.status !== 'error') {
                var drift = Math.abs(Number(merged.subtotal || 0) - expected) > 0.001;
                if (drift || merged.status === 'error' || !merged.items.length) {
                    var unionItems = (prev.items || []).concat(cur.items || []);
                    merged = {
                        text: mergedText,
                        meta: prev.meta || cur.meta,
                        orderNo: prev.orderNo,
                        items: unionItems,
                        totalCount: unionItems.reduce(function (sum, item) { return sum + item.count; }, 0),
                        subtotal: unionItems.reduce(function (sum, item) { return sum + item.subtotal; }, 0),
                        status: (prev.status === 'warn' || cur.status === 'warn') ? 'warn' : 'ok',
                        errors: [], warnings: [], note: ''
                    };
                }
            }

            multiPreviewState.parsed.splice(index - 1, 2, merged);
            multiResetOrderNumbers();
            multiRenderCards();
        };
    }

    // ---------- 预览顶部显示识别方式，便于核对 ----------
    var multiRenderSummaryBeforeV2 = (typeof multiRenderSummary === 'function') ? multiRenderSummary : null;
    if (multiRenderSummaryBeforeV2) {
        multiRenderSummary = function () {
            multiRenderSummaryBeforeV2();
            var target = document.getElementById('multiOrderSummary');
            if (!target) return;
            var mode = multiPreviewState && multiPreviewState.parsed && multiPreviewState.parsed.__mode;
            if (!mode) return;
            var label = mode === 'time' ? '按「网名+时间」识别单据'
                : (mode === 'blank' ? '按「空行 / 分隔线」识别单据' : '按原有规则识别单据');
            var line = document.createElement('div');
            line.className = 'mo-mode-tip';
            line.style.cssText = 'font-size:12px;color:#1976d2;margin-top:6px;';
            line.textContent = label;
            target.appendChild(line);
        };
    }

    // 记录识别方式，供上面的提示使用
    var multiScanAndRenderBeforeV2 = (typeof multiScanAndRender === 'function') ? multiScanAndRender : null;
    if (multiScanAndRenderBeforeV2) {
        multiScanAndRender = function () {
            var input = document.getElementById('multiOrderInput');
            var source = input ? String(input.value || '').trim() : '';
            if (source) {
                var built = multiBuildAndParse(source);
                var parsed = built.parsed;
                parsed.__mode = built.mode || 'legacy';
                multiPreviewState.source = source;
                multiPreviewState.parsed = parsed;
                multiRenderCards();
                return;
            }
            multiScanAndRenderBeforeV2();
        };
    }
})();

    var V3_WORDS = [

    var V3_KNOWN_CHARS = '鼠牛虎兔龙龍蛇马馬羊猴鸡雞狗猪豬' +

    function v3Text(value) { return String(value == null ? '' : value); }

    // ---------- 找出“没有参与计算”的中文片段 ----------
    function v3UnknownFragments(text) {
        var s = v3Text(text);
        s = s.replace(/\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日/g, '·');

    // ---------- 统计原文里的候选号码（用于发现“漏号”）----------
    function v3CandidateNumbers(text) {
        var s = v3Text(text);

        s = s.replace(/\d{1,2}:\d{2}(?::\d{2})?/g, ' ');
        var matches = s.match(/\d+/g) || [];
        var valid = 0;
        var invalid = [];
        var cursor = 0;
        matches.forEach(function (num) {
            var at = s.indexOf(num, cursor);
            cursor = at + num.length;
            if (num.length >= 3) return;                 // 金额、期号、连写数字不参与号码核对
            var value = parseInt(num, 10);
            var after = s.slice(cursor, cursor + 3);
            var before = s.slice(Math.max(0, at - 3), at);
            if (/[元米块快蚊斤闷塊]/.test(after)) return;  // 金额
            if (/(各|每|共|计|下|压|押|组|注|倍)\s*$/.test(before)) return;
            if (value >= 1 && value <= 49) { valid++; return; }

    function v3Enhance(block) {

        if (block.status === 'skip') return block;

        var text = v3Text(block.text);
        var items = block.items || [];
        var warnings = (block.warnings || []).slice();
        var errors = (block.errors || []).slice();

        }

        block.errors = block.status === 'error' ? v3Uniq(errors) : [];
        if (block.status !== 'error') {

    }

    // ---------- 包装切分入口（旧实现完整保留）----------
    var multiBuildAndParseBeforeV3 = multiBuildAndParse;

/* =====================================================================
   第99组补丁：单块「门/香/澳门/香港 + 三中三复式」标题 + 号码行
   —— 纯新增，不修改、不删除任何旧函数与正则。
   旧第88组要求块数 >= 2（即至少4行）才命中；本补丁只补「恰好1块=2行」这一种情况，
   其余任何文本一律原样交回旧函数 tryParseNewCases85to89 处理。
   ===================================================================== */
(function(){
    if (typeof tryParseNewCases85to89 !== 'function') return;
    var v99OldParse = tryParseNewCases85to89;
    var V99_HEADS = ['三中三复式','三中三复试','复式三中三','复试三中三'];

    function v99Comb(n, k){
        if (n < k) return 0;
        var v = 1;
        for (var i = 1; i <= k; i++) v = v * (n - i + 1) / i;
        return Math.round(v);
    }

    function v99Parse(text){
        var source = String(text || '').trim();
        if (!source) return null;
        var lines = source.split(/[\r\n]+/).map(function(s){ return s.trim(); }).filter(Boolean);
        if (lines.length !== 2) return null;                 // 只接管「标题行 + 数据行」

        // ---- 第1行：剥掉地区噪音词（门=澳门 香=香港 澳 奥 港 新澳 新澳门…），必须只剩标准玩法名 ----
        var head = lines[0]
            .replace(/^(?:新)?(?:澳门|香港|澳|门|香|奥|港|新)/g, '')
            .replace(/[\s，,。.、：:；;]/g, '');
        if (V99_HEADS.indexOf(head) < 0) return null;

        // ---- 第2行：必须有「各」，必须有金额，号码 3~10 个且在 01-49 ----
        var data = lines[1];
        if (!/各/.test(data)) return null;
        var mAmt = data.match(/([一二两三四五六七八九十百千零〇\d]+(?:\.\d+)?)\s*(?:元|米|块|块钱|快|闷|文|蚊|斤)?\s*$/);
        if (!mAmt) return null;
        var unit = parseAmountCN(mAmt[1]);
        if (unit === null || !(unit > 0)) return null;

        // 去掉尾部「各N单位」后，剩下的只能是号码与分隔符
        var bodyOnly = data.replace(/各\s*[一二两三四五六七八九十百千零〇\d]+(?:\.\d+)?[^\d]*$/, '');

        if (residue) return null;                            // 有其他文字 → 不接管

        var nums = (bodyOnly.match(/\d{1,2}/g) || []).map(function(x){ return parseInt(x, 10); });
        if (nums.length < 3 || nums.length > 10) return null;
        if (nums.some(function(n){ return n < 1 || n > 49; })) return null;

        var cnt = v99Comb(nums.length, 3);
        if (!(cnt > 0)) return null;

        return [{
            special: true,
            result: {
                type: '复式三中三',
                count: cnt,
                detail: nums.map(pad).join(' ') + ' (' + nums.length + '选3)',
                unit: unit,
                subtotal: cnt * unit
            },
            original: source
        }];
    }

    tryParseNewCases85to89 = function(text){
        var v99Hit = v99Parse(text);
        if (v99Hit) return v99Hit;
        return v99OldParse.apply(this, arguments);
    };
})();


/* =====================================================================
   第100组补丁：多单预览 —— 可修改、可单条确认、可跳过错误单加入历史

(function () {

        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {

    // ---------- 1. 卡片：编辑态优先，warn 加“确认”，error 改文案 ----------
    var v4CardBefore = multiCardHtml;

        block.status = 'ok';
        block.warnings = [];

        if (!block) return;

        var parsedPieces = pieces.map(function (p) {

        });
        if (!parsedPieces.length) {
            parsedPieces = [multiParseBlock({ text: text, meta: block.meta, orderNo: block.orderNo })];
        }

        var warns = usable.filter(function (b) { return b.status === 'warn'; });

        var addedItems = 0;
        usable.forEach(function (block) {
            (block.items || []).forEach(function (item) {
                historyData.push({
                    id: Date.now() + Math.random(),
                    original: block.text,
                    type: item.type,

                });

        if (!addedItems) {

            return;

        var mainInput = document.getElementById('commandInput');
        if (mainInput) mainInput.value = '';
        if (typeof renderHistory === 'function') renderHistory();
        multiClosePreview();

        if (tip) {

        var errs = blocks.filter(function (b) { return b.status === 'error'; }).length;

        }
        var summary = document.getElementById('multiOrderSummary');
        var hint = summary ? summary.querySelector('.mo-summary-hint') : null;
        if (hint && errs) {
            hint.textContent = '格式错误的 ' + errs + ' 条不会加入历史：点「修改本单」改正，或点「删除」后重算；也可以直接加入其余 ' + usable + ' 单。';
        }
    };

    // 防御：其他入口若调用旧 multiActionEdit，也改走内联编辑器，不再弹被屏蔽的 prompt
    if (typeof multiActionEdit === 'function') {
        multiActionEdit = function (index) {

            if (!block) return;
            v4.editIndex = index;
            v4.draft = String(block.text || '');
            multiRenderCards();
        };
    }

    v4InstallStyle();
    v4BindCards();
})();

    function v5OpenManual(index) {
        var block = multiPreviewState.parsed[index];
        if (!block) return;
        v5.manualIndex = index;
        v5.draft = (block.items || []).map(function (it) {
            return { type: it.type || '', detail: it.detail || '', count: it.count, unit: it.unit };
        });
        if (!v5.draft.length) v5.draft = [{ type: '', detail: '', count: '', unit: '' }];
        multiRenderCards();
    }

    function v5Save(index) {
        var block = multiPreviewState.parsed[index];
        if (!block) return;
        var items = [];
        for (var i = 0; i < v5.draft.length; i++) {
            var it = v5.draft[i];
            var type = String(it.type || '').trim();
            var count = num(it.count);
            if (!type && !count) continue;
            if (!type) { window.alert('第 ' + (i + 1) + ' 行还没填玩法名称。'); return; }
            if (!count) { window.alert('「' + type + '」的注数要大于 0。'); return; }
            var unit = num(it.unit);
            items.push({ type: type, detail: it.detail || '', count: count, unit: unit, subtotal: Math.round(count * unit * 100) / 100 });
        }
        if (!items.length) { window.alert('至少要有一行填写玩法名称和注数。'); return; }
        block.items = items;
        block.totalCount = items.reduce(function (s, x) { return s + x.count; }, 0);
        block.subtotal = items.reduce(function (s, x) { return s + x.subtotal; }, 0);
        block.status = 'ok';
        block.errors = [];
        block.warnings = [];
        block.manual = true;
        v5.manualIndex = null;
        v5.draft = [];
        multiRenderCards();
    }

    /* ---------------- 事件 ---------------- */
    function v5Bind() {
        var cards = document.getElementById('multiOrderCards');
        if (!cards || cards.getAttribute('data-v5') === '1') return;
        cards.setAttribute('data-v5', '1');

        cards.addEventListener('input', function (e) {
            var t = e.target;
            if (!t || !t.getAttribute) return;
            var f = t.getAttribute('data-v5-f');
            if (!f) return;
            var i = Number(t.getAttribute('data-v5-i'));
            if (!v5.draft[i]) return;
            if (f === 'type') v5.draft[i].type = t.value;
            else if (f === 'count') v5.draft[i].count = t.value;
            else if (f === 'unit') v5.draft[i].unit = t.value;
            var sumEl = cards.querySelector('[data-v5-sum="' + i + '"]');
            if (sumEl) sumEl.textContent = (num(v5.draft[i].count) * num(v5.draft[i].unit)) + ' 元';
        }, true);

        cards.addEventListener('click', function (e) {
            var t = e.target && e.target.closest ? e.target.closest('[data-mo-action],[data-v5-bar]') : null;
            if (!t) return;
            var act = t.getAttribute('data-mo-action');
            if (act !== 'v5-manual' && act !== 'v5-save' && act !== 'v5-cancel' &&
                act !== 'v5-add-row' && act !== 'v5-del-row') return;
            e.preventDefault();
            e.stopPropagation();
            var index = Number(t.getAttribute('data-mo-index'));
            if (act === 'v5-manual') v5OpenManual(index);
            else if (act === 'v5-cancel') { v5.manualIndex = null; v5.draft = []; multiRenderCards(); }
            else if (act === 'v5-save') v5Save(index);
            else if (act === 'v5-add-row') { v5.draft.push({ type: '', detail: '', count: '', unit: '' }); multiRenderCards(); }
            else if (act === 'v5-del-row') {
                var ri = Number(t.getAttribute('data-v5-i'));
                v5.draft.splice(ri, 1);
                multiRenderCards();
            }
        }, true);
    }

    function v5MountBar() {
        var cards = document.getElementById('multiOrderCards');
        if (!cards || document.getElementById('v5TodoBar')) return;
        var bar = document.createElement('div');
        bar.id = 'v5TodoBar';
        bar.className = 'v5-bar';
        bar.style.display = 'none';
        bar.addEventListener('click', function (e) {
            var t = e.target && e.target.closest ? e.target.closest('[data-v5-bar]') : null;
            if (!t) return;
            v5.filter = t.getAttribute('data-v5-bar');
            multiRenderCards();
        });
        cards.parentNode.insertBefore(bar, cards);
    }

    multiRenderSummary = function () {
        v5SummaryBefore();
        v5UpdateBar();
    };

    v5MountBar();
    v5Bind();

/* =====================================================================
   第104组补丁：多单预览的“准确率护栏”（只在预览层外面再包一层）
   —— 不修改任何原有函数，关掉本补丁即回到 12 的行为。
   1) 网名误吞修复：时间行上一行若其实是号码/玩法/金额，不再当网名剥掉
   2) 合计对账：原文写了「共 XX 元」的，与实际算出金额比对，不符直接红卡
   3) 重复单提示：两单原文完全相同，第二单提示“疑似重复粘贴”
   ===================================================================== */
(function () {
    if (typeof multiBuildAndParse !== 'function') return;
    if (typeof multiParseBlock !== 'function') return;

    var V7_PLAY_RE = /三中三|3中3|二中二|2中2|三中二|3中2|四全中|二中特|五中|六中|平特|特码|特碼|正码|正碼|尾数|半角|半波|波色|连肖|連肖|连码|連碼|复式|复试|複式|生肖|包绿|包蓝|包红|包綠|包藍|包紅|单数|双数|單數|雙數|不中|红波|紅波|蓝波|藍波|绿波|綠波/;
    var V7_UNIT_RE = /(元|米|块|塊|快|文|蚊|斤|闷|悶)/;
    var V7_AMT_WORD_RE = /(各|每|共|合计|合計|共计|共計|一共|这些|這些)/;

    // 这一行“像内容”而不是网名：含号码、含金额单位、含玩法或“各/每/共”
    function v7LooksLikeContent(line) {
        var t = String(line == null ? '' : line).trim();
        if (!t) return false;
        if (V7_PLAY_RE.test(t)) return true;
        if (V7_UNIT_RE.test(t)) return true;
        if (V7_AMT_WORD_RE.test(t)) return true;
        var digits = t.replace(/\D/g, '');
        if (digits.length >= 2) return true;   // 号码行 / 金额
        return false;
    }

    function v7HasRealPlay(items) {
        return (items || []).some(function (it) {
            var ty = String(it && it.type || '');
            return ty && ty !== '号码';
        });
    }
    function v7HasPlainNumber(items) {
        return (items || []).some(function (it) {
            return String(it && it.type || '') === '号码';
        });
    }

    // ---------- 1) 网名误吞修复 ----------
    // 切分时会把“时间行上面那一行”当作本单网名。若那一行其实是号码/玩法/金额，
    // 说明它是上一单的最后一行被误吞了，必须放回上一单末尾重算。
    function v7RepairNames(out) {
        var fixed = 0;
        var arr = out.parsed;
        for (var i = 0; i < arr.length; i++) {
            var p = arr[i];
            var meta = p.meta;
            if (!meta || !meta.name) continue;
            if (!v7LooksLikeContent(meta.name)) continue;

            var prev = arr[i - 1];
            if (!prev) continue;   // 第一单前面没有可归还原处，保持原样
            if (!prev.text && !(prev.items && prev.items.length)) continue;

            var merged = String(prev.text || '').trim() + '\n' + String(meta.name).trim();
            var np;
            try {
                np = multiParseBlock({
                    text: merged,
                    meta: prev.meta,
                    orderNo: prev.orderNo
                });
            } catch (e) { continue; }
            if (!np || !np.items || !np.items.length) continue;

            // 只在“原结果不可信”时采纳：状态非 ok，或只是裸号码，或金额变多
            var untrusted = (prev.status !== 'ok') || v7HasPlainNumber(prev.items);
            if (!untrusted && Number(np.subtotal || 0) <= Number(prev.subtotal || 0)) continue;

            np.note = (np.note ? np.note + '；' : '') + '已把被误当成下一单网名的一行放回本单末尾';
            np.warnings = (np.warnings || []).concat('上一行不是网名，已并入本单计算');
            arr[i - 1] = np;

            // 本单网名清空，label 只保留时间
            meta.name = '';
            meta.label = meta.time || meta.label || '';
            if (arr[i].meta) {
                arr[i].meta.name = '';
                arr[i].meta.label = arr[i].meta.time || arr[i].meta.label || '';
            }
            fixed++;
        }
        return fixed;
    }

    // ---------- 2) 合计对账 ----------
    // 「共 XX 元」可能指本单，也可能指整段/连续几单的累计，所以四种口径任一相符即通过。
    function v7CheckDeclaredTotal(out) {
        var hits = 0;
        var list = out.parsed;
        var n = list.length;
        var grand = 0;
        list.forEach(function (p) {
            if (p.status === 'error') return;
            grand += Number(p.subtotal || 0);
        });
        // 前缀和
        var prefix = [], acc = 0;
        list.forEach(function (p) {
            acc += (p.status === 'error' ? 0 : Number(p.subtotal || 0));
            prefix.push(acc);
        });

        list.forEach(function (p, i) {
            if (p.status === 'skip') return;
            if (!p.items || !p.items.length) return;
            var text = String(p.text || '');
            var m = text.match(/(?:共|合)\s*[计計]?\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(?:元|米|块|塊|闷|悶)?/);
            if (!m) return;
            var declared = Number(m[1]);
            var actual = Number(p.subtotal || 0);
            if (!(declared > 0) || !(actual > 0)) return;

            var eq = function (v) { return Math.abs(v - declared) < 0.005; };
            if (eq(actual)) return;                                  // 本单相符
            if (eq(grand)) return;                                    // 整段合计
            if (eq(prefix[i])) return;                                // 从头到本单的累计
            var rest = grand - (i > 0 ? prefix[i - 1] : 0);
            if (eq(rest)) return;                                     // 从本单到末尾的累计

            var diff = (actual - declared);
            p.status = 'error';
            p.errors = (p.errors || []).concat(
                '原文写的合计是 ' + declared + ' 元，实际算出 ' + actual + ' 元，' +
                (diff > 0 ? '多算 ' : '少算 ') + Math.abs(diff).toFixed(2) + ' 元'
            );
            hits++;
        });
        return hits;
    }

    // ---------- 3) 重复单提示 ----------
    function v7CheckDuplicate(out) {
        var seen = {};
        var hits = 0;
        out.parsed.forEach(function (p, i) {
            if (p.status === 'skip') return;
            var key = String(p.text || '').replace(/\s+/g, '');
            if (!key) return;
            if (seen[key] != null) {
                var first = seen[key] + 1;
                p.warnings = (p.warnings || []).concat('与第' + (first < 10 ? '0' + first : first) + '单内容完全相同，疑似重复粘贴');
                hits++;
            } else {
                seen[key] = i;
            }
        });
        return hits;
    }

    // ---------- 4) 相对时间归一化 ----------
    // 微信里同一天内的消息常显示为「昨天 22:03 / 星期天 09:15」，原有时间行判定不认，
    // 会整段退回旧规则（金额容易算错）。这里只把这些前缀去掉，保留 HH:MM。
    var V7_REL_TIME_RE = /^[ \t]*(?:昨天|前天|今天|星期[一二三四五六日天]|周[一二三四五六日天])[ \t]*(\d{1,2}:\d{2})/gm;
    function v7NormalizeRelativeTime(text) {
        var s = String(text == null ? '' : text);
        if (!/(昨天|前天|今天|星期[一二三四五六日天]|周[一二三四五六日天])/.test(s)) return s;
        return s.replace(V7_REL_TIME_RE, '$1');
    }

    var multiBuildAndParseBeforeV7 = multiBuildAndParse;
    multiBuildAndParse = function (text) {
        var out = multiBuildAndParseBeforeV7(v7NormalizeRelativeTime(text));
        if (!out || !out.parsed || !out.parsed.length) return out;
        try {
            v7RepairNames(out);
            v7CheckDeclaredTotal(out);
            v7CheckDuplicate(out);
        } catch (e) { /* 护栏出错不影响主流程 */ }
        return out;
    };
})();
/* ===== 第104组补丁结束 ===== */


/* =====================================================================
   第105组补丁：多单预览四项增强（只加在预览层，不改任何计算函数）
   ① 光有号码没玩法也没金额量词 → 拒绝计算（红卡）
   ② 空行切分产生的“孤儿段”→ 自动与相邻段合并后再算
   ③ 生词自学：把严格模式报出的未知词一键标为噪音，记在本机，下次不再报
   ④ 导出对账单：图片（可直接发客人）+ CSV（可进 Excel）
   ===================================================================== */
(function () {
    if (typeof multiBuildAndParse !== 'function') return;

    /* =================================================================
       ① 光有号码：没玩法、也没有任何金额量词，拒绝硬算
       ================================================================= */
    var V8_AMOUNT_WORD = /(各|每|个|個|元|米|块|塊|快|文|蚊|斤|闷|悶|下|共|合计|合計|共计|共計|一共)/;
    var V8_PLAY_WORD = /三中三|3中3|二中二|2中2|三中二|3中2|四全中|二中特|五中|六中|平特|特码|特碼|正码|正碼|尾数|尾數|半波|波色|连肖|連肖|连码|連碼|复式|复试|複式|生肖|包绿|包蓝|包红|包綠|包藍|包紅|单数|双数|單數|雙數|不中|红波|紅波|蓝波|藍波|绿波|綠波|平码|平碼/;

    function v8GuardPlainNumber(out) {
        out.parsed.forEach(function (p) {
            if (p.status === 'skip' || p.status === 'error') return;
            if (!p.items || !p.items.length) return;
            var allPlain = p.items.every(function (it) {
                return String(it && it.type || '') === '号码';
            });
            if (!allPlain) return;
            var text = String(p.text || '');
            if (V8_AMOUNT_WORD.test(text)) return;   // 有“各/个/元”等，说明金额来源明确
            if (V8_PLAY_WORD.test(text)) return;      // 有玩法词，交给原逻辑

            p.status = 'error';
            p.errors = (p.errors || []).concat(
                '这一单只有号码，既没写玩法（特码/三中三等），也没写“各/元”这类金额说明，' +
                '无法确认按什么算，已拒绝计算。请补上玩法或金额后重算。'
            );
        });
    }

    /* =================================================================
       ② 孤儿段合并：空行切出来的段如果单独算不出东西，尝试和相邻段合并
       ================================================================= */
    // 只有“有号码、没玩法、也还没算出来（或只被当成裸号码）”的碎片才允许合并。
    // 有玩法却缺金额的，是完整单据但写漏了金额，必须报红让用户补，不能悄悄并进别的单。
    function v8IsOrphan(p) {
        if (!p || p.status === 'skip') return false;
        var t = String(p.text || '');
        if (!/\d/.test(t)) return false;
        if (p.items && p.items.length) {
            var allPlain = p.items.every(function (it) { return String(it && it.type || '') === '号码'; });
            if (!allPlain) return false;
            if (V8_AMOUNT_WORD.test(t)) return false;   // 有“各/个/元”，是正常写法
            return true;                                 // 只算出裸号码，结果不可信
        }
        if (V8_PLAY_WORD.test(t)) return false;          // 缺金额的完整单据，保持红卡
        return true;
    }

    function v8TryMerge(prevText, nextText) {
        var merged = String(prevText || '').trim() + '\n' + String(nextText || '').trim();
        try {
            var np = multiParseBlock({ text: merged, meta: null });
            if (np && np.items && np.items.length && Number(np.subtotal || 0) > 0) return np;
        } catch (e) { /* ignore */ }
        return null;
    }

    function v8MergeOrphans(out) {
        if (out.mode !== 'blank') return 0;          // 时间行模式下不会出现这种切错
        var arr = out.parsed;
        if (!arr || arr.length < 2) return 0;
        var mergedCount = 0;
        var i = 0;
        var guard = 0;
        while (i < arr.length && guard++ < 500) {
            var p = arr[i];
            if (!v8IsOrphan(p)) { i++; continue; }

            var np = null, mode = '';
            // 优先与下一段合并（上一段通常已经算好了）
            if (i + 1 < arr.length && !v8IsOrphan(arr[i + 1])) {
                np = v8TryMerge(p.text, arr[i + 1].text);
                mode = 'next';
            }
            if (!np && i > 0 && !v8IsOrphan(arr[i - 1])) {
                np = v8TryMerge(arr[i - 1].text, p.text);
                mode = 'prev';
            }
            if (!np) { i++; continue; }

            np.orderNo = p.orderNo;
            np.note = (np.note ? np.note + '；' : '') + '原被空行切开的片段已与相邻段合并计算';
            np.warnings = (np.warnings || []).concat('这一段单独算不出来，已和相邻段合并，请核对');
            if (mode === 'next') {
                arr.splice(i, 2, np);
                if (out.blocks && out.blocks.length > i + 1) out.blocks.splice(i, 2, { text: np.text, meta: null });
            } else {
                arr.splice(i - 1, 2, np);
                if (out.blocks && out.blocks.length > i) out.blocks.splice(i - 1, 2, { text: np.text, meta: null });
                i--;
            }
            mergedCount++;
            if (i < 0) i = 0;
        }
        return mergedCount;
    }

    /* =================================================================
       ③ 生词自学：未知词一键标为噪音，本机记住
       ================================================================= */
    var V8_NOISE_KEY = 'multiNoiseWordsV8';
    var V8_UNKNOWN_RE = /有未参与计算的文字：「([^」]+)」/;

    function v8LoadNoise() {
        try {
            var raw = localStorage.getItem(V8_NOISE_KEY);
            var arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }
    function v8SaveNoise(list) {
        try { localStorage.setItem(V8_NOISE_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
    }
    function v8AddNoise(words) {
        var list = v8LoadNoise();
        var set = {};
        list.forEach(function (w) { set[w] = 1; });
        (words || []).forEach(function (w) {
            var t = String(w || '').trim();
            if (t && !set[t]) { list.push(t); set[t] = 1; }
        });
        v8SaveNoise(list);
        return list.length;
    }
    function v8ExtractUnknown(warningText) {
        var m = String(warningText || '').match(V8_UNKNOWN_RE);
        if (!m) return [];
        return m[1].split('、').map(function (s) { return s.trim(); }).filter(Boolean);
    }

    function v8ApplyNoiseWords(out) {
        var words = v8LoadNoise();
        if (!words.length) return 0;
        var set = {};
        words.forEach(function (w) { set[w] = 1; });
        var changed = 0;
        out.parsed.forEach(function (p) {
            if (!p.warnings || !p.warnings.length) return;
            var kept = [];
            var removed = false;
            p.warnings.forEach(function (w) {
                var list = v8ExtractUnknown(w);
                if (!list.length) { kept.push(w); return; }
                var allKnown = list.every(function (x) { return set[x]; });
                if (allKnown) { removed = true; return; }
                kept.push(w);
            });
            if (!removed) return;
            p.warnings = kept;
            if (!kept.length && p.status === 'warn') p.status = 'ok';
            changed++;
        });
        return changed;
    }

    /* =================================================================
       ④ 导出对账单：图片 + CSV
       ================================================================= */
    function v8Billable() {
        return (multiPreviewState.parsed || []).filter(function (b) {
            return b && b.status !== 'skip';

    }
    function v8Money(n) {
        var v = Number(n || 0);

    }
    function v8TimeTag() {
        var d = new Date();

    function v8BuildRows() {
        var rows = [];
        var blocks = v8Billable();
        blocks.forEach(function (b, idx) {
            var no = '第' + String(b.orderNo || (idx + 1)).padStart(2, '0') + '单';
            var meta = b.meta && (b.meta.label || b.meta.time) ? String(b.meta.label || b.meta.time) : '';
            var head = meta ? no + '  ' + meta : no;
            if (b.status === 'error') {
                rows.push({ head: head, type: '（未计算）', count: '', unit: '', amount: '', alert: (b.errors || []).join('；') });
                return;
            }
            (b.items || []).forEach(function (it) {
                rows.push({
                    head: head, type: it.type, count: it.count, unit: it.unit,
                    amount: it.subtotal, detail: it.detail || '', alert: ''
                });
            });
            if (!b.items || !b.items.length) {
                rows.push({ head: head, type: '（无明细）', count: '', unit: '', amount: '', alert: '' });
            }
        });
        return rows;
    }

    function v8ExportCsv() {
        var blocks = v8Billable();
        var lines = [];
        lines.push(['序号', '网名/时间', '玩法', '注数', '单价', '金额', '号码明细', '备注'].join(','));
        blocks.forEach(function (b, idx) {
            var no = String(b.orderNo || (idx + 1));
            var meta = b.meta && (b.meta.label || b.meta.time) ? String(b.meta.label || b.meta.time) : '';
            var note = (b.errors || []).concat(b.warnings || []).join('；');
            if (!b.items || !b.items.length) {
                lines.push([no, meta, '未计算', '', '', '', '', note].map(v8CsvCell).join(','));
                return;
            }
            b.items.forEach(function (it) {
                lines.push([no, meta, it.type, it.count, it.unit, v8Money(it.subtotal), it.detail || '', note].map(v8CsvCell).join(','));
            });
        });
        var valid = blocks.filter(function (b) { return b.status !== 'error'; });
        var total = valid.reduce(function (s, b) { return s + Number(b.subtotal || 0); }, 0);
        var totalCount = valid.reduce(function (s, b) { return s + Number(b.totalCount || 0); }, 0);
        lines.push('');
        lines.push(['合计', '', '', totalCount, '', v8Money(total), '', ''].map(v8CsvCell).join(','));
        return '\ufeff' + lines.join('\r\n');
    }
    function v8CsvCell(v) {
        var s = String(v == null ? '' : v);
        if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
    }

    function v8Download(filename, dataUrlOrText, mime) {
        try {
            var a = document.createElement('a');
            if (mime === 'text/csv') {
                a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(dataUrlOrText);
            } else {
                a.href = dataUrlOrText;
            }
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                try { document.body.removeChild(a); } catch (e) { }
            }, 1200);
        } catch (e) {
            try { window.open(dataUrlOrText, '_blank'); } catch (e2) { }
        }
    }

    function v8DrawBill() {
        var blocks = v8Billable();
        if (!blocks.length) { alert('还没有可导出的单据'); return null; }

        var rows = [];
        blocks.forEach(function (b, idx) {
            var no = '第' + String(b.orderNo || (idx + 1)).padStart(2, '0') + '单';
            var meta = b.meta && (b.meta.label || b.meta.time) ? String(b.meta.label || b.meta.time) : '';
            rows.push({ kind: 'head', text: no + (meta ? '   ' + meta : ''), amount: '' });
            if (b.status === 'error') {
                rows.push({ kind: 'line', text: '未计算：' + (b.errors || []).join('；'), amount: '' });
                return;
            }
            (b.items || []).forEach(function (it) {
                rows.push({
                    kind: 'line',
                    text: it.type + '   ' + it.count + '注 × ' + it.unit + '元',
                    detail: (it.detail || '').slice(0, 42),
                    amount: v8Money(it.subtotal) + ' 元'
                });
            });
        });

        var valid = blocks.filter(function (b) { return b.status !== 'error'; });
        var total = valid.reduce(function (s, b) { return s + Number(b.subtotal || 0); }, 0);
        var totalCount = valid.reduce(function (s, b) { return s + Number(b.totalCount || 0); }, 0);

        var W = 760;
        var padX = 26, headH = 84, rowH = 27, footH = 74;
        var H = headH + rows.length * rowH + footH + 20;
        var cv = document.createElement('canvas');
        var scale = 2;
        cv.width = W * scale;
        cv.height = H * scale;
        var ctx = cv.getContext('2d');
        ctx.scale(scale, scale);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, H);

        var FONT = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        // 标题
        ctx.fillStyle = '#172033';
        ctx.font = '700 20px ' + FONT;
        ctx.fillText('投注对账单', padX, 38);
        ctx.fillStyle = '#8b96a3';
        ctx.font = '400 12px ' + FONT;
        ctx.fillText('导出时间 ' + new Date().toLocaleString('zh-CN'), padX, 60);

        var y = headH;
        ctx.strokeStyle = '#e6ebf1';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(padX, y - 12); ctx.lineTo(W - padX, y - 12); ctx.stroke();

        rows.forEach(function (r) {
            if (r.kind === 'head') {
                ctx.fillStyle = '#0f766e';
                ctx.font = '700 13px ' + FONT;
                ctx.fillText(r.text, padX, y + 4);
            } else {
                ctx.fillStyle = '#334155';
                ctx.font = '400 13px ' + FONT;
                ctx.fillText(r.text, padX + 10, y + 4);
                if (r.detail) {
                    ctx.fillStyle = '#a3aebc';
                    ctx.font = '400 11px ' + FONT;
                    ctx.fillText(r.detail, padX + 250, y + 4);
                }
                if (r.amount) {
                    ctx.fillStyle = '#172033';
                    ctx.font = '700 13px ' + FONT;
                    var tw = ctx.measureText(r.amount).width;
                    ctx.fillText(r.amount, W - padX - tw, y + 4);
                }
            }
            y += rowH;
        });

        y += 6;
        ctx.strokeStyle = '#e6ebf1';
        ctx.beginPath(); ctx.moveTo(padX, y - 8); ctx.lineTo(W - padX, y - 8); ctx.stroke();
        y += 22;
        ctx.fillStyle = '#172033';
        ctx.font = '700 15px ' + FONT;
        ctx.fillText('合计  ' + totalCount + ' 注  /  ' + v8Money(total) + ' 元', padX, y);

        return cv.toDataURL('image/png');
    }

/* =================================================================
   第106组补丁：数据分析 / 开奖验证 —— 复式玩法并入对应主玩法统计
   -----------------------------------------------------------------
   合并规则（只合并“显示分组”，不动任何一条明细的注数/金额/赔率）：
     复式二中二 / 复式2中2        → 二中二
     复式三中三 / 复式3中3        → 三中三
     复式二连肖 / 复式二肖连 / 复式2肖连  → 平特二连肖
     复式三连肖 / 复式三肖连 / 复式3肖连  → 平特三连肖
     复式四连肖 / 复式四肖连 / 复式4肖连  → 平特四连肖
     复式五连肖 / 复式五肖连 / 复式5肖连  → 平特五连肖
   安全性说明：
     1. 不删除、不修改任何旧函数体，只用 var xxxBeforeV106 = xxx 包装；
     2. 只在调用旧函数期间临时替换全局 historyData（换成 type 已归一化的浅拷贝），
        调用结束后立刻在 finally 里换回原数组，历史明细本身一个字段都不改；
     3. 复式与主玩法在赔率表里本就同赔（二中二60 / 三中三600 / 连肖 4-10-30-100），
        因此合并后金额、占比、盈亏数字与合并前完全等价；
     4. 装饰层（“含复式”角标）全部 try/catch 包裹，任何异常都不影响主流程。
   ================================================================= */
(function () {
    'use strict';

    var CN_NUM_106 = { '1': '一', '一': '一', '2': '二', '二': '二', '3': '三', '三': '三', '4': '四', '四': '四', '5': '五', '五': '五', '6': '六', '六': '六' };

    /* ---------- 1. 玩法名归一化 ---------- */
    function v106MergeType(name) {
        if (!name) return name;
        var s = String(name).replace(/\s+/g, '').replace(/复试/g, '复式');
        var m;

        // 1.1 二中二 / 三中三（可带“复式”前缀）
        m = s.match(/^(复式)?([二三2-3])中([二三2-3])$/);
        if (m) {
            var a = CN_NUM_106[m[2]];
            var b = CN_NUM_106[m[3]];
            if (a && b && a === b) {
                if (a === '二') return '二中二';
                if (a === '三') return '三中三';
            }
            return s; // 三中二 / 二中三 之类原样保留
        }

        // 1.2 复式连肖：复式二连肖 / 复式二肖连 / 复式2肖连
        m = s.match(/^复式([一二三四五六2-6])连?肖连?$/);
        if (m) {
            var k1 = CN_NUM_106[m[1]];
            if (k1 === '一') return '平特一肖';
            if (k1) return '平特' + k1 + '连肖';
            return s;
        }

        // 1.3 平特连肖：平特二连肖 / 平特2连肖（统一成中文数字，避免同一种玩法拆成两行）
        m = s.match(/^平特([一二三四五六2-6])连肖$/);
        if (m) {
            var k2 = CN_NUM_106[m[1]];
            if (k2 === '一') return '平特一肖';
            if (k2) return '平特' + k2 + '连肖';
            return s;
        }

        return s;
    }

    /* ---------- 2. 调用旧函数时临时切到“归一化视图” ---------- */
    function v106CloneWithMergedType(item) {
        if (!item) return item;
        var t = v106MergeType(item.type);
        if (!t || t === item.type) return item;
        var copy = {};
        for (var k in item) {
            if (Object.prototype.hasOwnProperty.call(item, k)) copy[k] = item[k];
        }
        copy.type = t;
        return copy;
    }

    function v106RunMerged(fn, arg, useArg) {
        var backup = historyData;
        var switched = false;
        try {
            if (Object.prototype.toString.call(backup) === '[object Array]' && backup.length) {
                historyData = backup.map(v106CloneWithMergedType);
                switched = true;
            }
        } catch (e) {
            historyData = backup;
            switched = false;
        }
        try {
            return useArg ? fn(arg) : fn();
        } finally {
            if (switched) historyData = backup;
        }
    }

    /* ---------- 3. “含复式”角标 ---------- */
    function v106MergedNames() {
        var set = {};
        try {
            var list = historyData || [];
            for (var i = 0; i < list.length; i++) {
                var it = list[i];
                var t = v106MergeType(it && it.type);
                if (t && it && t !== it.type) set[t] = true;
            }
        } catch (e) { /* ignore */ }
        return set;
    }

    var V106_TAG = '<span class="v106-tag">含复式</span>';

    function v106DecorateAnalytics() {
        var set = v106MergedNames();
        if (!Object.keys(set).length) return;
        var box = document.getElementById('analyticsTypes');
        if (!box || !box.children) return;
        for (var i = 0; i < box.children.length; i++) {
            var row = box.children[i];
            var nameEl = row && row.firstElementChild;
            if (!nameEl) continue;
            var name = String(nameEl.textContent || '').replace(/\s+/g, '');
            if (!Object.prototype.hasOwnProperty.call(set, name)) continue;
            if (String(nameEl.innerHTML || '').indexOf('v106-tag') !== -1) continue;
            nameEl.innerHTML = nameEl.innerHTML + V106_TAG;
        }
    }

    function v106DecorateVerify() {
        var set = v106MergedNames();
        if (!Object.keys(set).length) return;
        var box = document.getElementById('verifySummary');
        if (!box || !box.children) return;
        for (var i = 0; i < box.children.length; i++) {
            var row = box.children[i];
            if (!row || row.className !== 'stat-line') continue;
            var html = String(row.innerHTML || '');
            for (var name in set) {
                if (!Object.prototype.hasOwnProperty.call(set, name)) continue;
                var head = name + '：';
                if (html.indexOf(head) === 0) {
                    row.innerHTML = name + V106_TAG + '：' + html.slice(head.length);
                    break;
                }
            }
        }
    }

    /* ---------- 4. 样式（极简角标，不占版面） ---------- */
    function v106EnsureStyle() {
        if (document.getElementById('v106-style')) return;
        var st = document.createElement('style');
        st.id = 'v106-style';
        st.textContent = '.v106-tag{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;'
            + 'font-size:10px;font-weight:400;line-height:15px;color:#8d6e63;background:#efebe9;vertical-align:1px;}';
        (document.head || document.body).appendChild(st);
    }

    /* ---------- 5. 包装入口 ---------- */
    if (typeof updateAnalytics === 'function') {
        var updateAnalyticsBeforeV106 = updateAnalytics;
        updateAnalytics = function (totalAmount) {
            var ret = v106RunMerged(updateAnalyticsBeforeV106, totalAmount, true);
            try {
                v106EnsureStyle();
                v106DecorateAnalytics();
            } catch (e) { /* 角标失败不影响主流程 */ }
            return ret;
        };
    }

    if (typeof renderVerifySummary === 'function') {
        var renderVerifySummaryBeforeV106 = renderVerifySummary;
        renderVerifySummary = function () {
            var ret = v106RunMerged(renderVerifySummaryBeforeV106, null, false);
            try {
                v106EnsureStyle();
                v106DecorateVerify();
            } catch (e) { /* 角标失败不影响主流程 */ }
            return ret;
        };
    }

    // 对外暴露，方便自测（不参与任何计算）
    try {
        window.v106MergeType = v106MergeType;
    } catch (e) { /* ignore */ }
})();
/* ===== 第106组补丁结束 ===== */

</script>
